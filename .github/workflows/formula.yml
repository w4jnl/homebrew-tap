name: formula

on:
  push:
    paths: ['Formula/**', 'Casks/**', '.github/workflows/formula.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # nt for Mac: a notarized DMG on nt's GitHub release, macOS 26 or later. Style and the audit,
  # which downloads it and checks its checksum, run anywhere; the install only where it can.
  cask:
    name: cask (nt-app)
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@49d03f1bf5d455a413dfbdf99e6718054a4cd975 # master
      - run: brew style --cask w4jnl/tap/nt-app
      - run: brew audit --cask --strict --online w4jnl/tap/nt-app
      - name: install, where macOS is 26 or later
        run: |
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 26 ]; then
            brew install --cask w4jnl/tap/nt-app
            out=$(spctl --assess -vv /Applications/nt.app 2>&1) || true
            echo "$out"
            grep -q "source=Notarized Developer ID" <<<"$out"
          else
            echo "macOS $(sw_vers -productVersion): nt for Mac needs 26, so no install here"
          fi
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-homebrew taps this repository itself (at the pushed commit) when it runs inside a
      # homebrew-* repo; tapping again from a path fails with "remote mismatch".
      - uses: Homebrew/actions/setup-homebrew@49d03f1bf5d455a413dfbdf99e6718054a4cd975 # master
      - run: brew tap-info w4jnl/tap
      - run: brew install --build-from-source w4jnl/tap/flok
      - run: brew test flok
      - run: brew audit --strict --online w4jnl/tap/flok
      - run: brew style w4jnl/tap/flok
      # mwrelay's repo is private — runners can't clone it, so no install/
      # test/audit here; style is pure RuboCop and needs no fetch.
      - run: brew style w4jnl/tap/mwrelay
      - run: brew install --build-from-source w4jnl/tap/vink
      - run: brew test vink
      - run: brew audit --strict --online w4jnl/tap/vink
      - run: brew style w4jnl/tap/vink
      - run: brew install --build-from-source w4jnl/tap/nt
      - run: brew test nt
      - run: brew audit --strict --online w4jnl/tap/nt
      - run: brew style w4jnl/tap/nt
