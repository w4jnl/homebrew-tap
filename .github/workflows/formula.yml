name: formula

on:
  push:
    paths: ['Formula/**', '.github/workflows/formula.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@49d03f1bf5d455a413dfbdf99e6718054a4cd975 # master
      - name: tap this checkout
        run: brew tap w4jnl/tap "$PWD"
      - run: brew install --build-from-source w4jnl/tap/flok
      - run: brew test flok
      - run: brew audit --strict --online w4jnl/tap/flok
      - run: brew style w4jnl/tap/flok
